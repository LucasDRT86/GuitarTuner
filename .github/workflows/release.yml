name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest

      - name: Compilation de l'APK
        run: ./gradlew assembleDebug

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GuitarTuner-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GuitarTuner-apk
          path: GuitarTuner-*.apk

      - name: Publier dans la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Accordeur ${{ github.ref_name }}
          body: |
            APK de l'accordeur pour guitare classique.
            Téléchargez GuitarTuner-${{ github.ref_name }}.apk sur votre téléphone Android, puis ouvrez-le
            (autorisez l'installation depuis des sources inconnues si Android le demande).
          files: GuitarTuner-*.apk
