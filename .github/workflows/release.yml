name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v1.1). Laisser vide pour compiler sans publier."
        required: false
        default: ""

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest

      - name: Compilation de l'APK
        run: ./gradlew assembleDebug

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GuitarTuner-${{ env.VERSION }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GuitarTuner-apk
          path: GuitarTuner-*.apk

      - name: Publier dans la release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Accordeur ${{ env.VERSION }}
          body: |
            APK de l'accordeur pour guitare classique.
            Téléchargez GuitarTuner-${{ env.VERSION }}.apk sur votre téléphone Android, puis ouvrez-le
            (autorisez l'installation depuis des sources inconnues si Android le demande).
          files: GuitarTuner-*.apk
